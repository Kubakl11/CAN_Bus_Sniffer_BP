<title>Vehicle Overview — OBD-II</title>
<script>
  // Apply saved theme before render — prevents dark→light flash on page load
  (function() {
    const t = localStorage.getItem('obd_theme');
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══ Theme BUTTON ══════════════════════════════════════════════════════ -->
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
  <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>
<script>
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'light' ? 'dark' : 'light';
    if (next === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('obd_theme', 'light');
    } else {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('obd_theme', 'dark');
    }
  }
</script>

<div class="page active" style="display:block">

  <div class="page-header">
    <a href="dashboard.html" class="back-btn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div>
      <div class="page-title">Vehicle Overview</div>
      <div class="page-subtitle">OBD-II PID Data</div>
    </div>
  </div>

  <!-- Widget Settings 
  <div style="margin-bottom:20px;position:relative" id="pid-dropdown-wrap">
  <button id="pid-dropdown-btn" class="glass-card" style="width:100%;border-radius:var(--radius);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border:1px solid var(--border)">
    <div>
    <div class="section-title" style="margin-bottom:0">Show on main page</div>
    <div style="font-size:14px;color:var(--muted-foreground);margin-top:3px" id="pid-selected-summary">5 values selected</div>
    </div>
    <span id="pid-arrow" style="color:var(--muted-foreground);font-size:12px;transition:transform .2s">▼</span>
    </button>
    <div id="pid-dropdown" class="glass-card" style="display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;border-radius:var(--radius);padding:12px;z-index:50;border:1px solid var(--border)">
    <div class="pid-selector" id="pid-selector"></div>
  </div>
  </div>
  -->
  <div class="section-title">Core Operating Data</div>
  <div class="data-card-grid" id="vd-basic"></div>

  <div class="section-title">Temperatures & Pressures</div>
  <div class="data-card-grid" id="vd-temps"></div>

  <div class="section-title">Fuel & Mixture</div>
  <div class="data-card-grid" id="vd-fuel"></div>

  <div class="section-title">Engine Management</div>
  <div class="data-card-grid" id="vd-engine"></div>

  <div class="section-title">Electrical System</div>
  <div class="data-card-grid" id="vd-elec"></div>

  <!-- History -->
  <div class="section-title" style="margin-top:4px">Data History</div>

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px">
    <div class="glass-card" style="border-radius:var(--radius);padding:10px;text-align:center">
      <div style="font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-foreground);margin-bottom:3px">Logs</div>
      <div class="font-mono" style="font-size:18px;font-weight:700;color:var(--primary)" id="hs-count">0</div>
    </div>
    <div class="glass-card" style="border-radius:var(--radius);padding:10px;text-align:center">
      <div style="font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-foreground);margin-bottom:3px">Max Speed</div>
      <div class="font-mono" style="font-size:18px;font-weight:700;color:var(--primary)" id="hs-maxspeed">—</div>
    </div>
    <div class="glass-card" style="border-radius:var(--radius);padding:10px;text-align:center">
      <div style="font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-foreground);margin-bottom:3px">Avg RPM</div>
      <div class="font-mono" style="font-size:18px;font-weight:700;color:var(--primary)" id="hs-avgrpm">—</div>
    </div>
    <div class="glass-card" style="border-radius:var(--radius);padding:10px;text-align:center">
      <div style="font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-foreground);margin-bottom:3px">Max Temp</div>
      <div class="font-mono" style="font-size:18px;font-weight:700;color:var(--primary)" id="hs-maxtemp">—</div>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:10px">
    <button id="btn-export" class="glass-card" style="padding:7px 14px;border-radius:8px;color:var(--foreground);font-size:10px;font-weight:600;cursor:pointer;letter-spacing:.06em;text-transform:uppercase">
      📥 Export CSV
    </button>
    <button id="btn-clear" style="padding:7px 14px;border-radius:8px;border:1px solid hsla(0,85%,55%,.25);background:hsla(0,85%,55%,.08);color:var(--bmw-red);font-size:10px;font-weight:600;cursor:pointer;letter-spacing:.06em;text-transform:uppercase">
      🗑 Clear
    </button>
  </div>

  <div class="history-wrap glass-card">
    <div class="history-scroll">
      <table class="history-table">
        <thead>
          <tr>
            <th>#</th><th>Time</th><th>RPM</th><th>km/h</th>

        </thead>
        <tbody id="history-tbody">
          <tr><td colspan="8" class="history-empty">System waiting for data</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script type="module">
import { getData,  getTripHistory, clearTripHistory } from './data.js';

const thermIcon = '<path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>';
const gaugeIcon = '<path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/>';
const windIcon  = '<path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>';
const dropIcon  = '<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>';
const zapIcon   = '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>';
const actIcon   = '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>';
const batIcon   = '<rect x="2" y="7" width="16" height="10" rx="2" ry="2"/><line x1="22" y1="11" x2="22" y2="13"/>';
const clockIcon = '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>';

const ALL_PIDS = [
  // ─── ZÁKLADNÍ ÚDAJE (Core) ──────────────────────────────────────
  { key:'rpm',             label:'RPM',             pid:'0x0C', unit:'rpm',    icon:actIcon,   warn:v=>v>6500 },
  { key:'speed',           label:'Speed',           pid:'0x0D', unit:'km/h',   icon:gaugeIcon, warn:null },
  { key:'coolantTemp',     label:'Coolant Temp',    pid:'0x05', unit:'°C',     icon:thermIcon, warn:v=>v>105 },
  { key:'throttle',        label:'Throttle Pos.',   pid:'0x11', unit:'%',      icon:gaugeIcon, warn:null },
  { key:'engineLoad',      label:'Engine Load',     pid:'0x04', unit:'%',      icon:actIcon,   warn:v=>v>90 },
  { key:'absoluteLoad',    label:'Absolute Load',   pid:'0x43', unit:'%',      icon:actIcon,   warn:null },

  // ─── TEPLOTY (Temperatures) ─────────────────────────────────────
  { key:'intakeAirTemp',   label:'Intake Air',      pid:'0x0F', unit:'°C',     icon:thermIcon, warn:null },
  { key:'outdoorTemp',     label:'Outdoor Temp',    pid:'0x46', unit:'°C',     icon:thermIcon, warn:null },
  { key:'catalystTemp',    label:'Catalyst Temp',   pid:'0x3C', unit:'°C',     icon:thermIcon, warn:v=>v>800 },
  { key:'oilTemp',         label:'Engine Oil',      pid:'0x5C', unit:'°C',     icon:thermIcon, warn:v=>v>120 },

  // ─── TLAKY A VZDUCH (Pressures & Air) ───────────────────────────
  { key:'mapPressure',     label:'MAP Pressure',    pid:'0x0B', unit:'kPa',    icon:gaugeIcon, warn:null },
  { key:'barometric',      label:'Baro. Pressure',  pid:'0x33', unit:'kPa',    icon:gaugeIcon, warn:null },
  { key:'maf',             label:'MAF Flow Rate',   pid:'0x10', unit:'g/s',    icon:windIcon,  warn:null },

  // ─── PALIVO A SMĚS (Fuel & Mixture) ─────────────────────────────
  { key:'fuelConsumption', label:'Fuel Consump.',   pid:'0x5E', unit:'L/h',    icon:dropIcon,  warn:null },
  { key:'fuelLevel',       label:'Fuel Level',      pid:'0x2F', unit:'%',      icon:dropIcon,  warn:v=>v<10 },
  { key:'fuelPressure',    label:'Fuel Pressure',   pid:'0x0A', unit:'kPa',    icon:gaugeIcon, warn:null },
  { key:'fuelRail',        label:'Fuel Rail Pres.', pid:'0x23', unit:'kPa',    icon:gaugeIcon, warn:null },
  { key:'ethanolPct',      label:'Ethanol %',       pid:'0x52', unit:'%',      icon:dropIcon,  warn:null },
  { key:'lambda',          label:'Equiv. Ratio (λ)',pid:'0x44', unit:'',       icon:actIcon,   warn:null },
  { key:'o2Voltage',       label:'O2 Sensor Vol.',  pid:'0x14', unit:'V',      icon:zapIcon,   warn:null },
  { key:'stft',            label:'Short Term FT',   pid:'0x06', unit:'%',      icon:actIcon,   warn:v=>v>15||v<-15 },
  { key:'ltft',            label:'Long Term FT',    pid:'0x07', unit:'%',      icon:actIcon,   warn:v=>v>15||v<-15 },

  // ─── ŘÍZENÍ MOTORU (Engine Management) ──────────────────────────
  { key:'ignitionTiming',  label:'Ignition Timing', pid:'0x0E', unit:'°',      icon:zapIcon,   warn:null },
  { key:'egrCommanded',    label:'EGR Commanded',   pid:'0x2C', unit:'%',      icon:windIcon,  warn:null },
  { key:'egrError',        label:'EGR Error',       pid:'0x2D', unit:'%',      icon:windIcon,  warn:null },
  { key:'evapPurge',       label:'EVAP Purge',      pid:'0x2E', unit:'%',      icon:windIcon,  warn:null },

  // ─── ELEKTRIKA A OSTATNÍ (Electrical & Misc) ────────────────────
  { key:'systemVoltage',   label:'System Voltage',  pid:'0x42', unit:'V',      icon:batIcon,   warn:v=>v<12 },
  { key:'engineRuntime',   label:'Engine Runtime',  pid:'0x1F', unit:'min',    icon:clockIcon, warn:null },
  { key:'milDistance',     label:'MIL Distance',    pid:'0x21', unit:'km',     icon:actIcon,   warn:v=>v>0 },
  { key:'distCleared',     label:'Dist. Since Clr', pid:'0x31', unit:'km',    icon:actIcon,   warn:null },
  { key:'hybridBattery',   label:'Hybrid Battery',  pid:'0x5B', unit:'%',      icon:batIcon,   warn:v=>v<20 }
];


const SECTIONS = [
  { id:'vd-basic',  keys:['rpm','speed','coolantTemp','throttle','engineLoad','absoluteLoad'] },
  { id:'vd-temps',  keys:['intakeAirTemp','outdoorTemp','catalystTemp','oilTemp'] },
  { id:'vd-fuel',   keys:['fuelConsumption','fuelLevel','fuelPressure','fuelRail','ethanolPct','lambda','o2Voltage','stft','ltft'] },
  { id:'vd-engine', keys:['mapPressure','barometric','maf','ignitionTiming','egrCommanded','egrError','evapPurge'] },
  { id:'vd-elec',   keys:['systemVoltage','engineRuntime','milDistance','distCleared','hybridBattery'] },
];

// PID selector
const STORAGE_KEY = 'obd_dashboard_pids';
let selectedPids = (() => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || ['rpm','speed','coolantTemp','systemVoltage','engineLoad']; } catch { return ['rpm','speed','coolantTemp','systemVoltage','engineLoad']; } })();

let selectorRendered = false;
function renderSelector(d) {
  const wasOpen = document.getElementById('pid-dropdown')?.style.display === 'block';
  const wrap = document.getElementById('pid-selector');
  
  // V dropdownu ukážeme jen ty PIDy, které auto posílá (nejsou null/undefined)
  const supportedPids = d ? ALL_PIDS.filter(p => d[p.key] != null) : ALL_PIDS;

  wrap.innerHTML = supportedPids.map(p => `
    <button class="pid-toggle ${selectedPids.includes(p.key)?'active':''}" data-key="${p.key}">
      <span class="pt-check">${selectedPids.includes(p.key)?'✓':''}</span>
      ${p.label}
    </button>`).join('');
    
  wrap.querySelectorAll('.pid-toggle').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = btn.dataset.key;
      if (selectedPids.includes(key)) {
        selectedPids = selectedPids.filter(k => k !== key);
      } else {
        if (selectedPids.length >= 5) selectedPids.shift();
        selectedPids.push(key);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedPids));
      renderSelector(d); 
      document.getElementById('pid-selected-summary').textContent = selectedPids.length + ' values selected';
    });
  });
  document.getElementById('pid-selected-summary').textContent = selectedPids.length + ' values selected';
  if (wasOpen) document.getElementById('pid-dropdown').style.display = 'block';
}

function renderCards(d) {
  SECTIONS.forEach(sec => {
    const el = document.getElementById(sec.id);
    if (!el) return;
    el.innerHTML = sec.keys.map(key => {
      const p = ALL_PIDS.find(x => x.key === key);
      if (!p) return '';
      const value = d[p.key];
      if (value == null) return '';

      // formatovani engine runtime
      let v, unit;
      if (key === 'engineRuntime') {
        const mins = Math.floor(value / 60);
        const secs = Math.floor(value % 60);
        v = `${mins}:${secs.toString().padStart(2, '0')}`;
        unit = 'min';
      } else {
        v = typeof value === 'number' ? value.toFixed(value % 1 === 0 ? 0 : 1) : '--';
        unit = p.unit;
      }

      const warn = p.warn ? p.warn(value) : false;
      return `<div class="data-card glass-card ${warn?'warn':''}">
        <div class="dc-icon-row"><svg viewBox="0 0 24 24">${p.icon}</svg><span class="dc-lbl">${p.label}</span></div>
        <div><span class="dc-val font-mono">${v}</span> <span class="dc-unit">${unit}</span></div>
      </div>`;
    }).join('');
  });
}

// History
const historyData = [];
let frame = 0;

function recordData(d) {
    if (d.rpm == null || d.speed == null) return;
    historyData.unshift({
        time: new Date().toLocaleTimeString(),
        rpm:     Math.round(d.rpm),
        speed:   Math.round(d.speed),
        coolant:  d.coolantTemp     != null ? d.coolantTemp.toFixed(1)     : '—',
        voltage:  d.systemVoltage   != null ? d.systemVoltage.toFixed(1)   : '—',
        fuel:     d.fuelConsumption != null ? d.fuelConsumption.toFixed(1) : '—',
        load:     d.engineLoad      != null ? d.engineLoad.toFixed(0)      : '—',
    });
    if (historyData.length > 200) historyData.pop();
    renderHistory();
}

function renderHistory() {
  const tbody = document.getElementById('history-tbody');
  if (!historyData.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="history-empty">History will begin filling automatically…</td></tr>';
    return;
  }
  tbody.innerHTML = historyData.map((r, i) => `<tr>
    <td style="color:var(--muted-foreground)">${historyData.length - i}</td>
    <td style="color:var(--muted-foreground)">${r.time}</td>
    <td>${r.rpm}</td><td>${r.speed}</td>
    <td class="${parseFloat(r.coolant)>100?'danger':''}">${r.coolant}</td>
    <td class="${parseFloat(r.voltage)<12?'danger':''}">${r.voltage}</td>
    <td>${r.fuel}</td>
    <td class="${parseFloat(r.load)>85?'warn':''}">${r.load}</td>
  </tr>`).join('');
  document.getElementById('hs-count').textContent = historyData.length;
  document.getElementById('hs-maxspeed').textContent = Math.max(...historyData.map(r=>r.speed)) + ' km/h';
  document.getElementById('hs-avgrpm').textContent = Math.round(historyData.reduce((s,r)=>s+r.rpm,0)/historyData.length);
  document.getElementById('hs-maxtemp').textContent = Math.max(...historyData.map(r=>parseFloat(r.coolant))).toFixed(1) + '°C';
}

document.getElementById('btn-export').addEventListener('click', () => {
    const history = getTripHistory();
    if (!history.length) { alert('No trip data yet.'); return; }
    const rows = history.map(r =>
        `${new Date(r.t).toLocaleTimeString()},${r.rpm??''},${r.speed??''},${r.coolantTemp??''},${r.systemVoltage??''},${r.fuelConsumption??''},${r.engineLoad??''}`
    ).join('\n');
    const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(new Blob(
            ['Time,RPM,Speed,Coolant,Voltage,Consumption,Load\n'+rows],
            {type:'text/csv'}
        )),
        download: `obd_full_${new Date().toISOString().slice(0,10)}.csv`
    });
    a.click();
});

document.getElementById('btn-clear').addEventListener('click', () => {
    if (!confirm('Clear entire history? This will also clear graph data.')) return;
    historyData.length = 0;
    clearTripHistory();
    renderHistory();
});


function update() {
  const d = getData();
  
  
  renderCards(d);
  frame++;
  if (frame % 25 === 0) recordData(d);
}



setInterval(update, 200);
update();
</script>
</body>
</html>
