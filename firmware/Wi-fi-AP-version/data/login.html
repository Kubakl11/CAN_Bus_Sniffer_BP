<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Vehicle Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;overflow:hidden;
  position:relative;
}

/* Ambient glow background */
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse 600px 400px at 20% 30%, hsla(213,85%,47%,.08), transparent 60%),
    radial-gradient(ellipse 500px 300px at 80% 70%, hsla(213,85%,47%,.05), transparent 60%);
  pointer-events:none;
}

/* Grid background */
body::after{
  content:'';position:fixed;inset:0;z-index:-1;
  background-image:
    linear-gradient(hsla(220,15%,20%,.25) 1px, transparent 1px),
    linear-gradient(90deg, hsla(220,15%,20%,.25) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%);
  pointer-events:none;
}

.login-wrap{
  width:100%;max-width:420px;
  animation:fadeIn .5s ease-out;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* Brand */
.login-brand{
  text-align:center;margin-bottom:28px;
}
.login-brand .eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  color:hsla(215,15%,50%,.6);margin-bottom:8px;
}
.login-brand h1{
  font-size:clamp(22px,4.5vw,30px);font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;
}
.login-brand h1 span{
  color:var(--primary);text-shadow:0 0 20px var(--primary-glow);
}
.login-brand .sep{
  display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;
}
.login-brand .sep::before, .login-brand .sep::after{
  content:'';height:1px;width:50px;
}
.login-brand .sep::before{background:linear-gradient(to right,transparent,var(--primary-glow))}
.login-brand .sep::after{background:linear-gradient(to left,transparent,var(--primary-glow))}
.login-brand .sep-text{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--primary);
}

/* Card */
.login-card{
  background:hsla(220,18%,14%,.85);
  border:1px solid var(--border);
  border-radius:16px;
  padding:28px 26px;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 20px 60px hsla(220,18%,5%,.5), 0 0 0 1px hsla(213,85%,47%,.05);
}

/* Header with lock icon */
.login-header{
  display:flex;align-items:center;gap:12px;
  padding-bottom:18px;margin-bottom:20px;
  border-bottom:1px solid var(--border);
}
.lock-icon{
  width:36px;height:36px;border-radius:10px;
  background:hsla(213,85%,47%,.12);
  border:1px solid hsla(213,85%,47%,.3);
  display:flex;align-items:center;justify-content:center;
  color:var(--primary);flex-shrink:0;
}
.lock-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 6px var(--primary-glow))}
.login-header .lh-title{
  font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
}
.login-header .lh-sub{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--muted-foreground);margin-top:2px;
}

/* Form */
.login-form .fld{
  display:flex;flex-direction:column;gap:6px;margin-bottom:14px;
}
.login-form .fld-lbl{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted-foreground);
}
.login-form .input-wrap{
  position:relative;display:flex;align-items:center;
}
.login-form .input-wrap svg{
  position:absolute;left:12px;width:14px;height:14px;
  stroke:var(--muted-foreground);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  pointer-events:none;transition:stroke .15s;
}
.login-form input{
  font-family:'JetBrains Mono',monospace;
  font-size:14px;font-weight:500;
  background:var(--background);color:var(--foreground);
  border:1px solid var(--border);border-radius:8px;
  padding:11px 12px 11px 36px;outline:none;width:100%;
  transition:border-color .15s, box-shadow .15s;
}
.login-form input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px hsla(213,85%,47%,.12);
}
.login-form input:focus ~ svg,
.login-form .input-wrap:focus-within svg{
  stroke:var(--primary);
}

/* Show/hide password */
.pwd-toggle{
  position:absolute;right:8px;
  width:28px;height:28px;border-radius:5px;
  background:transparent;border:none;cursor:pointer;
  color:var(--muted-foreground);
  display:flex;align-items:center;justify-content:center;
  transition:color .15s;
}
.pwd-toggle:hover{color:var(--foreground)}
.pwd-toggle svg{
  position:static !important;width:14px;height:14px;
  stroke:currentColor !important;
}

/* Checkbox */
.remember-row{
  display:flex;align-items:center;justify-content:space-between;
  margin:4px 0 18px;
}
.remember{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted-foreground);user-select:none;
}
.remember input{display:none}
.remember .box{
  width:14px;height:14px;border:1px solid var(--border);
  border-radius:3px;background:var(--background);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.remember input:checked + .box{
  background:var(--primary);border-color:var(--primary);
}
.remember input:checked + .box::after{
  content:'';width:8px;height:4px;
  border:2px solid white;border-top:0;border-right:0;
  transform:rotate(-45deg) translateY(-1px);
}
.remember:hover{color:var(--foreground)}

/* Submit button */
.login-submit{
  width:100%;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  padding:13px;border-radius:8px;border:1px solid var(--primary);
  background:linear-gradient(180deg, hsla(213,85%,52%,.25), hsla(213,85%,42%,.25));
  color:var(--primary);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s;
  box-shadow:0 0 0 3px hsla(213,85%,47%,.05), 0 0 20px hsla(213,85%,47%,.1);
}
.login-submit:hover:not(:disabled){
  background:linear-gradient(180deg, hsla(213,85%,52%,.4), hsla(213,85%,42%,.4));
  box-shadow:0 0 0 3px hsla(213,85%,47%,.1), 0 0 30px hsla(213,85%,47%,.25);
  color:white;
}
.login-submit:active:not(:disabled){transform:translateY(1px)}
.login-submit:disabled{opacity:.5;cursor:not-allowed}
.login-submit svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Error */
.login-error{
  display:none;align-items:center;gap:10px;
  padding:10px 12px;margin-bottom:14px;border-radius:8px;
  background:hsla(0,85%,55%,.08);border:1px solid hsla(0,85%,55%,.3);
  color:var(--bmw-red);font-size:12px;
  animation:shake .35s;
}
.login-error.show{display:flex}
.login-error svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}

/* Footer */
.login-footer{
  text-align:center;margin-top:20px;
  font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:.15em;text-transform:uppercase;
  color:hsla(215,15%,50%,.5);
}
.login-footer a{color:var(--primary);text-decoration:none;margin-left:6px}
.login-footer a:hover{text-shadow:0 0 8px var(--primary-glow)}

/* Status bar bottom */
.login-meta{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:16px;padding-top:16px;border-top:1px solid var(--border);
  font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:.1em;color:var(--muted-foreground);
}
.login-meta .live-dot{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--status-ok);box-shadow:0 0 6px var(--status-ok);
  margin-right:6px;animation:pulse 2s infinite;
}
</style>
</head>
<body>

<div class="login-wrap">

  <!-- Brand -->
  <div class="login-brand">
    <div class="eyebrow">Automotive monitoring</div>
    <h1>Vehicle <span>Cockpit</span></h1>
    <div class="sep"><span class="sep-text">Secure access</span></div>
  </div>

  <!-- Card -->
  <div class="login-card">

    <div class="login-header">
      <div class="lock-icon">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div>
        <div class="lh-title">Diagnostic Access</div>
        <div class="lh-sub">Please enter your credentials</div>
      </div>
    </div>

    <!-- Error box -->
    <div class="login-error" id="errBox">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="errMsg">Incorrect login credentials.</span>
    </div>

    <!-- Form -->
    <form class="login-form" onsubmit="event.preventDefault(); login();" autocomplete="on">

      <div class="fld">
        <label class="fld-lbl" for="username">Username</label>
        <div class="input-wrap">
          <input type="text" id="username" name="username"
                 autocomplete="username" required
                 placeholder="admin">
          <svg viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>

      <div class="fld">
        <label class="fld-lbl" for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password"
                 autocomplete="current-password" required
                 placeholder="••••••••">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <button type="button" class="pwd-toggle" onclick="togglePwd()" id="pwdToggleBtn"
                  title="Show / hide password">
            <svg viewBox="0 0 24 24" id="pwdEye">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="remember-row">
        <label class="remember">
          <input type="checkbox" id="remember">
          <span class="box"></span>
          Remember device
        </label>
      </div>

      <button type="submit" class="login-submit" id="submitBtn">
        <svg viewBox="0 0 24 24">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        <span id="submitText">Login</span>
      </button>

    </form>

    <!-- Footer info -->
    <div class="login-meta">
      <span><span class="live-dot"></span>Server online</span>
      <span id="sessionId">SID · <span style="color:var(--primary)">—</span></span>
    </div>

  </div>

  <!-- Back link -->
  <div class="login-footer">
    ← <a href="dashboard.html">Back to cockpit</a>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// AUTH CONFIG - setup users
// ═══════════════════════════════════════════════════════════════════════
const CREDENTIALS = [
  { username: 'admin',   password: 'diag2026' },
  { username: 'aaa',     password: 'aaa'      },
];
const SESSION_KEY = 'vc_diag_session';
const REMEMBER_KEY = 'vc_diag_remember';

// Random session ID for display in meta bar
document.querySelector('#sessionId span').textContent =
  Math.random().toString(36).slice(2,8).toUpperCase();

// If user "remembered device", pre-fill the username
const remembered = localStorage.getItem(REMEMBER_KEY);
if (remembered) {
  document.getElementById('username').value = remembered;
  document.getElementById('remember').checked = true;
  document.getElementById('password').focus();
} else {
  document.getElementById('username').focus();
}

// If already logged in, go straight to diagnostics
if (sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY)) {
  // but respect ?force=1 for forced re-login
  if (!location.search.includes('force')) {
    location.replace('diagnostic.html');
  }
}

function togglePwd() {
  const inp = document.getElementById('password');
  const eye = document.getElementById('pwdEye');
  if (inp.type === 'password') {
    inp.type = 'text';
    eye.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    inp.type = 'password';
    eye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function showError(msg) {
  const box = document.getElementById('errBox');
  document.getElementById('errMsg').textContent = msg;
  box.classList.remove('show');
  void box.offsetWidth; // restart animation
  box.classList.add('show');
}

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const remember = document.getElementById('remember').checked;
  const btn = document.getElementById('submitBtn');
  const txt = document.getElementById('submitText');

  if (!username || !password) {
    showError('Please enter both username and password.');
    return;
  }

  // Loading state
  btn.disabled = true;
  txt.textContent = 'Verifying…';
  document.getElementById('errBox').classList.remove('show');

  // Try Flask API (when ready); if it fails, fallback to client-side check
  let authOk = false;
  let token = null;

  try {
    const r = await fetch('/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    if (r.ok) {
      const j = await r.json();
      authOk = j.ok === true;
      token = j.token;
    }
  } catch (e) {
    // Flask not ready – use client-side check
  }

  if (!authOk) {
    // Client-side fallback (TEMPORARY)
    if (CREDENTIALS.some(c => c.username === username && c.password === password)) {
      authOk = true;
      token = 'local_' + Math.random().toString(36).slice(2) + '_' + Date.now();
    }
  }

  // Artificial wait so it doesn't look weird
  await new Promise(r => setTimeout(r, 350));

  if (!authOk) {
    btn.disabled = false;
    txt.textContent = 'Login';
    showError('Incorrect username or password.');
    document.getElementById('password').select();
    return;
  }

  // Save session
  const store = remember ? localStorage : sessionStorage;
  store.setItem(SESSION_KEY, JSON.stringify({
    token,
    user: username,
    loginAt: Date.now(),
  }));

  if (remember) {
    localStorage.setItem(REMEMBER_KEY, username);
  } else {
    localStorage.removeItem(REMEMBER_KEY);
  }

  // Success animation + redirect
  txt.textContent = '✓  Logged in';
  btn.style.background = 'linear-gradient(180deg, hsla(142,70%,45%,.35), hsla(142,70%,40%,.35))';
  btn.style.borderColor = 'var(--status-ok)';
  btn.style.color = 'white';

  setTimeout(() => {
    // If user was redirected from a locked page, send them back
    const returnTo = sessionStorage.getItem('vc_return_to');
    if (returnTo) {
      sessionStorage.removeItem('vc_return_to');
      location.replace(returnTo);
    } else {
      location.replace('diagnostic.html');
    }
  }, 500);
}
</script>
</body>
</html>
