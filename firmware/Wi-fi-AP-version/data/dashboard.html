<script>
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'light' ? 'dark' : 'light';
    if (next === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('obd_theme', 'light');
    } else {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('obd_theme', 'dark');
    }
  }
</script>

<script type="module">
import { getData } from './data.js';

// ══ NAVIGATION ══════════════════════════════════════════════════════════
const pages = ['cockpit','vehicle-data','graphs','alarms','consumption'];
window.nav = function(id){
  pages.forEach(p=>{
    document.getElementById('page-'+p)?.classList.toggle('active',p===id);
    const nb = document.getElementById('nb-'+p);
    if(nb) nb.classList.toggle('active',p===id);
  });
}

// ══ DATA ════════════════════════════════════════════════════════════════
let D = getData();

// ══ GAUGE MATH ════════════════════════════════════════════════════════════
const R=140,CX=160,CY=160,CIRC=2*Math.PI*R,ARCLEN=CIRC*270/360;

function setArc(id,val,max){
  const f=Math.max(0,Math.min(val/max,1));
  const filled=f*ARCLEN;
  document.getElementById(id).setAttribute('stroke-dasharray',`${filled} ${CIRC-filled}`);
}

function setNeedle(bodyId,shadowId,val,max){
  const f=Math.max(0,Math.min(val/max,1));
  const angle=-225+f*270;
  const rad=angle*Math.PI/180;
  const needleLen=110, baseLen=0, hw=3;
  const nx=CX+needleLen*Math.cos(rad);
  const ny=CY+needleLen*Math.sin(rad);
  const bx=CX-baseLen*Math.cos(rad);
  const by=CY-baseLen*Math.sin(rad);
  const pr=rad+Math.PI/2;
  const pts=`${nx},${ny} ${bx+hw*Math.cos(pr)},${by+hw*Math.sin(pr)} ${bx-hw*Math.cos(pr)},${by-hw*Math.sin(pr)}`;
  const sPts=`${nx},${ny} ${bx+hw*Math.cos(pr)+2},${by+hw*Math.sin(pr)+2} ${bx-hw*Math.cos(pr)+2},${by-hw*Math.sin(pr)+2}`;
  document.getElementById(bodyId).setAttribute('points',pts);
  document.getElementById(shadowId).setAttribute('points',sPts);
}

// ── Mini Chart.js grafy pro widget ───────────────────────────────
const MINI_POINTS = 20;

function makeMiniChart(canvasId, color) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  return new Chart(ctx, {
    type: 'line',
    data: {
      labels: Array(MINI_POINTS).fill(''),
      datasets: [{
        data: Array(MINI_POINTS).fill(null),
        borderColor: color,
        borderWidth: 1.5,
        tension: 0.3,
        pointRadius: 0,
        fill: true,
        backgroundColor: color + '18',
      }]
    },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { display: false },
        y: {
          display: true,
          ticks: {
            maxTicksLimit: 3,
            font: { size: 8 },
            color: 'hsl(215,15%,40%)',
          },
          grid: { color: 'hsla(220,15%,20%,0.4)' },
          border: { display: false },
        }
      },
      plugins: { legend: { display: false }, tooltip: { enabled: false } }
    }
  });
}

const miniCharts = {
  rpm: makeMiniChart('spk-rpm', '#1C69D4'),
  spd: makeMiniChart('spk-spd', '#00C49F'),
  tmp: makeMiniChart('spk-tmp', '#FF6B00'),
};

function pushMini(chart, value) {
  chart.data.datasets[0].data.push(value);
  chart.data.datasets[0].data.shift();
  chart.update('none');
}

// ══ ALARMS ════════════════════════════════════════════════════════════════
function getAlarms(d) {
    const a = [];
    let config = {};
    try { config = JSON.parse(localStorage.getItem('obd_alarm_config')) || {}; } catch {}

    const check = (id, key, defaultThreshold, level, msg, fmt, compareFn) => {
        if (d[key] == null) return;
        const cfg = config[id] || { enabled: true, threshold: defaultThreshold };
        if (!cfg.enabled) return;
        if (compareFn(d[key], cfg.threshold)) {
            a.push({ level, msg, val: fmt(d[key]) });
        }
    };

    check('rpm',      'rpm',          6500,  'critical', 'Engine RPM exceeded',    v => `${Math.round(v)} rpm`, (v,t) => v > t);
    check('coolant',  'coolantTemp',  100,   'critical', 'Coolant overheating',    v => `${v.toFixed(0)}°C`,    (v,t) => v > t);
    check('voltage',  'systemVoltage',12.5,  'warning',  'Low system voltage',     v => `${v.toFixed(1)}V`,     (v,t) => v < t);
    check('load',     'engineLoad',   85,    'warning',  'High engine load',       v => `${v.toFixed(0)}%`,     (v,t) => v > t);
    check('catalyst', 'catalystTemp', 800,   'critical', 'Catalyst overheating',   v => `${v.toFixed(0)}°C`,    (v,t) => v > t);
    check('speed',    'speed',        160,   'warning',  'Speed exceeded',         v => `${Math.round(v)} km/h`,(v,t) => v > t);

    return a;
}

// ══ ALARMS WIDGET (cockpit) ══════════════════════════════════════════════
let _alarmWidgetBuilt = false;
let _alarmSlots = [];
let _alarmShield;

function buildAlarmWidget() {
  const el = document.getElementById('w-alarms');
  el.innerHTML = `
    <div class="alarm-shield" data-role="shield">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <p>All systems OK</p>
    </div>
    ${[0,1,2,3].map(i => `
      <div class="alarm-item" data-slot="${i}" style="display:none">
        <div class="adot"></div>
        <span class="amsg"></span>
        <span class="aval"></span>
      </div>`).join('')}
  `;
  _alarmShield = el.querySelector('[data-role="shield"]');
  _alarmSlots = [0,1,2,3].map(i => {
    const slot = el.querySelector(`[data-slot="${i}"]`);
    return { root: slot, msg: slot.querySelector('.amsg'), val: slot.querySelector('.aval') };
  });
  _alarmWidgetBuilt = true;
}

function renderAlarmsWidget(alarms) {
  if (!_alarmWidgetBuilt) buildAlarmWidget();
  const ind = document.getElementById('w-alarm-ind');
  const visible = alarms.slice(0, 4);

  const newClass = visible.length ? 'widget-dot red' : 'widget-dot green';
  if (ind.className !== newClass) ind.className = newClass;

  const showShield = visible.length === 0;
  if (_alarmShield.style.display !== (showShield ? '' : 'none')) {
    _alarmShield.style.display = showShield ? '' : 'none';
  }

  for (let i = 0; i < 4; i++) {
    const slot = _alarmSlots[i];
    const a = visible[i];
    if (a) {
      const cls = 'alarm-item ' + a.level;
      if (slot.root.className !== cls) slot.root.className = cls;
      if (slot.root.style.display !== '') slot.root.style.display = '';
      if (slot.msg.textContent !== a.msg) slot.msg.textContent = a.msg;
      if (slot.val.textContent !== a.val) slot.val.textContent = a.val;
    } else {
      if (slot.root.style.display !== 'none') slot.root.style.display = 'none';
    }
  }
}

  { key:'intakeAirTemp',   label:'Intake Air',      pid:'0x0F', unit:'°C',     icon:thermIcon, warn:null },

  { key:'mapPressure',     label:'MAP Pressure',    pid:'0x0B', unit:'kPa',    icon:gaugeIcon, warn:null },

  { key:'maf',             label:'MAF Flow Rate',   pid:'0x10', unit:'g/s',    icon:windIcon,  warn:null },

  // ─── PALIVO A SMĚS (Fuel & Mixture) ─────────────────────────────
  { key:'fuelConsumption', label:'Fuel Consump.',   pid:'0x5E', unit:'L/h',    icon:dropIcon,  warn:null },
  { key:'fuelLevel',       label:'Fuel Level',      pid:'0x2F', unit:'%',      icon:dropIcon,  warn:v=>v<10 },
  { key:'fuelPressure',    label:'Fuel Pressure',   pid:'0x0A', unit:'kPa',    icon:gaugeIcon, warn:null },

  { key:'o2Voltage',       label:'O2 Sensor Vol.',  pid:'0x14', unit:'V',      icon:zapIcon,   warn:null },
  { key:'stft',            label:'Short Term FT',   pid:'0x06', unit:'%',      icon:actIcon,   warn:v=>v>15||v<-15 },

  { key:'milDistance',     label:'MIL Distance',    pid:'0x21', unit:'km',     icon:actIcon,   warn:v=>v>0 },
  { key:'distCleared',     label:'Dist. Since Clr', pid:'0x31', unit:'km',    icon:actIcon,   warn:null },
  { key:'hybridBattery',   label:'Hybrid Battery',  pid:'0x5B', unit:'%',      icon:batIcon,   warn:v=>v<20 }
];

let _vehWidgetBuilt = false;
let _vehSlots = [];
let _lastSavedPids = "";

function buildVehicleWidget(d) {
  let savedPids = ['engineLoad', 'throttle', 'intakeAirTemp', 'coolantTemp', 'systemVoltage'];
  try {
    const parsed = JSON.parse(localStorage.getItem('obd_dashboard_pids'));
    if (Array.isArray(parsed) && parsed.length > 0) savedPids = parsed;
  } catch(e) {}
  

  const available = savedPids.map(key => ALL_PIDS.find(p => p.key === key))
                             .filter(p => p && d[p.key] != null);

  const el = document.getElementById('w-vehicle');
  el.innerHTML = available.map((p, i) => `
    <div class="data-row" data-slot="${i}">
      <div class="dr-icon"><svg viewBox="0 0 24 24">${p.icon}</svg>${p.label}</div>
      <span class="dr-val font-mono"></span>
    </div>
  `).join('');
  
  _vehSlots = available.map((p, i) => ({
    pid: p,
    valEl: el.querySelector(`[data-slot="${i}"] .dr-val`),
  }));
  _vehWidgetBuilt = true;
}

function renderVehicleWidget(d) {
  const currentSavedPids = localStorage.getItem('obd_dashboard_pids') || "";
  if (!_vehWidgetBuilt || _lastSavedPids !== currentSavedPids) {
    buildVehicleWidget(d);
    _lastSavedPids = currentSavedPids;
  }
  
  for (const slot of _vehSlots) {
    const v = d[slot.pid.key];
    if (v == null) continue;
    const formatted = (v % 1 === 0 ? v.toFixed(0) : v.toFixed(1)) + ' ' + slot.pid.unit;
    if (slot.valEl.textContent !== formatted) slot.valEl.textContent = formatted;
    const isWarn = slot.pid.warn ? slot.pid.warn(v) : false;
    const cls = 'dr-val font-mono' + (isWarn ? ' danger' : '');
    if (slot.valEl.className !== cls) slot.valEl.className = cls;
  }
}

// ══ Consumption setup ======
let wStartL = 0, wStartDist = 0, wLastTime = Date.now(), wLastSpd = 0;
// ══ MAIN UPDATE ══════════════════════════════════════════════════════════
let frame=0;

function update(){
  D = getData();
  const d=D;
  frame++;

  // Gauges
  setArc('rpmFill',d.rpm,8000);
  setArc('spdFill',d.speed,280);
  setNeedle('rpmNeedleBody','rpmNeedleShadow',d.rpm,8000);
  setNeedle('spdNeedleBody','spdNeedleShadow',d.speed,280);
  document.getElementById('rpmVal').textContent = d.rpm != null ? Math.round(d.rpm) : '—';
  document.getElementById('spdVal').textContent = d.speed != null ? Math.round(d.speed) : '—';

  const rpmColor = d.rpm > 7000 ? 'hsl(0,85%,55%)' : 'hsl(213,85%,50%)';
  const rpmFill = document.getElementById('rpmFill');
  if (rpmFill.getAttribute('stroke') !== rpmColor) {
    rpmFill.setAttribute('stroke', rpmColor);
    document.getElementById('rpmVal').style.color = rpmColor;
  }

  // Sparklines
  pushMini(miniCharts.rpm, d.rpm ?? 0);
  pushMini(miniCharts.spd, d.speed ?? 0);
  pushMini(miniCharts.tmp, d.coolantTemp ?? 0);
  document.getElementById('sw-rpm').textContent = d.rpm != null ? Math.round(d.rpm) : '—';
  document.getElementById('sw-spd').textContent = d.speed != null ? Math.round(d.speed) : '—';
  document.getElementById('sw-tmp').textContent = d.coolantTemp != null ? Math.round(d.coolantTemp) + '°' : '—';

  // Consumption
  const lp100 = d.speed > 5 ? (d.fuelConsumption / d.speed) * 100 : null;
  const wNow = Date.now();
  const wDtH = (wNow - wLastTime) / 3600000;
  wLastTime = wNow;
  wStartL += (d.fuelConsumption ?? 0) * wDtH;
  wStartDist += ((d.speed + wLastSpd) / 2) * wDtH;
  wLastSpd = d.speed ?? 0;
  const avgLp100 = wStartDist > 0.05 ? (wStartL / wStartDist) * 100 : null;

  document.getElementById('w-cons-num').textContent = lp100 ? lp100.toFixed(1) : '—';
  document.getElementById('w-cons-avg').textContent = avgLp100 ? avgLp100.toFixed(1) : '—';
  document.getElementById('w-cons-lh').textContent = d.fuelConsumption != null ? d.fuelConsumption.toFixed(1) : '—';

  // Alarms + vehicle data
  if (frame % 2 === 0) {
    const alarms = getAlarms(d);
    renderAlarmsWidget(alarms);
    renderVehicleWidget(d);
  }
}

// ══ INIT ════════════════════════════════════════════════════════════════
setInterval(update,200);
update();
</script>
