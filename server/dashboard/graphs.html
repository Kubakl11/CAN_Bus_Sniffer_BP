<script>
  // Apply saved theme before render — prevents dark→light flash on page load
  (function() {
    const t = localStorage.getItem('obd_theme');
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>

<style>
.graphs-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
@media(max-width:640px){.graphs-grid{grid-template-columns:1fr}}

.graph-card {
  border-radius: var(--radius);
  padding: 14px;
}
.graph-hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.graph-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted-foreground);
}
.graph-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
}
.graph-canvas-wrap {
  height: 160px;
  width: 100%;
}
.graph-footer {
  display: flex;
  justify-content: flex-end;
  margin-top: 6px;
}
.graph-reset {
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted-foreground);
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
  transition: color .2s;
}
.graph-reset:hover { color: var(--primary); }
</style>
</head>
<body>

<!-- ══ Theme BUTTON ══════════════════════════════════════════════════════ -->
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
  <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
</button>
<script>
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'light' ? 'dark' : 'light';
    if (next === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('obd_theme', 'light');
    } else {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('obd_theme', 'dark');
    }
  }
</script>

<div class="page active" style="display:block">

  <div class="page-header">
    <a href="dashboard.html" class="back-btn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div>
      <div class="page-title">Live Graphs</div>
    </div>
    <button onclick="resetAllGraphs()" style="background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--muted-foreground);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:color .2s,border-color .2s" onmouseover="this.style.color='var(--primary)';this.style.borderColor='var(--primary)'" onmouseout="this.style.color='var(--muted-foreground)';this.style.borderColor='var(--border)'">
      ↺ Reset All
    </button>
  </div>

  <div class="graphs-grid" id="graphs-grid">
    <!-- Graphs are generated dynamically based on available PIDs -->
  </div>

</div>

<script type="module">
import { getData, getLastN } from './data.js';

const MAX_POINTS = 300;  // ~1 minuta @ 5 Hz

const GRAPH_DEFS = [
  { key: 'rpm',             label: 'RPM',              unit: 'rpm',  color: '#1C69D4', yMin: 0,  yMax: 8000 },
  { key: 'speed',           label: 'Speed',            unit: 'km/h', color: '#00C49F', yMin: 0,  yMax: 280  },
  { key: 'coolantTemp',     label: 'Coolant Temp',     unit: '°C',   color: '#FF6B00', yMin: 0,  yMax: 130  },
  { key: 'engineLoad',      label: 'Engine Load',      unit: '%',    color: '#8884d8', yMin: 0,  yMax: 100  },
  { key: 'throttle',        label: 'Throttle Position',unit: '%',    color: '#FFBB28', yMin: 0,  yMax: 100  },
  { key: 'fuelConsumption', label: 'Fuel Consumption', unit: 'L/h',  color: '#FF4444', yMin: 0,  yMax: 20   },
  { key: 'systemVoltage',   label: 'System Voltage',   unit: 'V',    color: '#FF9F40', yMin: 10, yMax: 16   },
  { key: 'intakeAirTemp',   label: 'Intake Air',       unit: '°C',   color: '#4BC0C0', yMin: 0,  yMax: 80   },
  { key: 'mapPressure',     label: 'MAP Pressure',     unit: 'kPa',  color: '#9966FF', yMin: 0,  yMax: 200  },
  { key: 'maf',             label: 'MAF',              unit: 'g/s',  color: '#36A2EB', yMin: 0,  yMax: 100  },
  { key: 'o2Voltage',       label: 'O2 Sensor',        unit: 'V',    color: '#FF6384', yMin: 0,  yMax: 1    },
  { key: 'catalystTemp',    label: 'Catalyst',         unit: '°C',   color: '#FF3333', yMin: 0,  yMax: 900  },
];

Chart.defaults.color = 'hsl(215,15%,50%)';
Chart.defaults.borderColor = 'hsla(220,15%,20%,0.5)';
Chart.defaults.font.family = "'JetBrains Mono', monospace";
Chart.defaults.font.size = 10;

const charts = {};
let availableGraphs = [];
let initialized = false;

// ── Inicializace grafů — spustí se jakmile přijdou první data ────────
function initGraphs(d) {
  availableGraphs = GRAPH_DEFS.filter(g => d[g.key] != null);
  if (availableGraphs.length === 0) return false;

  const grid = document.getElementById('graphs-grid');
  grid.innerHTML = availableGraphs.map(g => `
    <div class="graph-card glass-card">
      <div class="graph-hdr">
        <span class="graph-label">${g.label}</span>
        <span class="graph-val font-mono" id="gv-${g.key}" style="color:${g.color}">—</span>
      </div>
      <div class="graph-canvas-wrap">
        <canvas id="gc-${g.key}"></canvas>
      </div>
      <div class="graph-footer">
        <button class="graph-reset" onclick="resetGraph('${g.key}')">↺ Reset</button>
      </div>
    </div>
  `).join('');

  availableGraphs.forEach(g => {
    const ctx = document.getElementById(`gc-${g.key}`).getContext('2d');
    charts[g.key] = new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{ label: g.label, data: [],
        borderColor: g.color, borderWidth: 2, tension: 0.3,
        pointRadius: 0, fill: true, backgroundColor: g.color + '18' }] },
      options: {
        animation: false, responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { title: { display: true, text: 'Time', color: 'hsl(215,15%,40%)', font: { size: 9 } },
               ticks: { maxTicksLimit: 6, maxRotation: 0, font: { size: 9 } },
               grid: { color: 'hsla(220,15%,20%,0.4)' } },
          y: { min: g.yMin, max: g.yMax,
               title: { display: true, text: g.unit, color: 'hsl(215,15%,40%)', font: { size: 9 } },
               ticks: { font: { size: 9 } },
               grid: { color: 'hsla(220,15%,20%,0.4)' } }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'hsla(220,18%,14%,0.95)', borderColor: 'hsl(220,15%,25%)', borderWidth: 1,
            titleColor: 'hsl(215,15%,50%)', bodyColor: g.color,
            callbacks: { label: ctx => `${ctx.parsed.y.toFixed(1)} ${g.unit}` }
          },
          zoom: { zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' },
                  pan: { enabled: true, mode: 'x' } }
        }
      }
    });
  });

  initialized = true;
  return true;
}

// ── Načti historii z DB a naplň grafy ────────────────────────────────
async function loadHistory() {
  const rows = await getLastN(300);
  if (!rows.length) return;
  rows.forEach(row => {
    const label = row.timestamp
      ? new Date(row.timestamp).toLocaleTimeString()
      : '—';
    availableGraphs.forEach(g => {
      const v = row[g.key];
      if (v == null) return;
      const chart = charts[g.key];
      chart.data.labels.push(label);
      chart.data.datasets[0].data.push(v);
    });
  });
  availableGraphs.forEach(g => charts[g.key]?.update('none'));
}

// ── Reset jednoho grafu (data + zoom) ────────────────────────────────
window.resetGraph = function(key) {
  const chart = charts[key];
  if (!chart) return;
  chart.data.labels = [];
  chart.data.datasets[0].data = [];
  chart.update('none');
  chart.resetZoom?.();
};

// ── Reset všech grafů ─────────────────────────────────────────────────
window.resetAllGraphs = function() {
  availableGraphs.forEach(g => resetGraph(g.key));
};

// ── Live update loop ──────────────────────────────────────────────────
function update() {
  const d = getData();

  if (!initialized) {
    if (!initGraphs(d)) return;
    loadHistory();  // načti historii hned po init
  }

  const now = new Date().toLocaleTimeString();
  availableGraphs.forEach(g => {
    const value = d[g.key];
    if (value == null) return;
    const chart = charts[g.key];
    chart.data.labels.push(now);
    chart.data.datasets[0].data.push(value);
    if (chart.data.labels.length > MAX_POINTS) {
      chart.data.labels.shift();
      chart.data.datasets[0].data.shift();
    }
    chart.update('none');
    const decimals = value % 1 === 0 ? 0 : 1;
    const el = document.getElementById(`gv-${g.key}`);
    if (el) el.textContent = value.toFixed(decimals) + ' ' + g.unit;
  });
}

setInterval(update, 200);
update();
</script>
</body>
